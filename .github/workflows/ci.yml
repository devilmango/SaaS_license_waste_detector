name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run example analysis
        run: >-
          saas-sentry analyze
          --hr examples/hr.csv
          --usage examples/usage.csv
          --billing examples/billing.csv
          --contract-pricing examples/contract-pricing.csv
          --config config.example.toml
          --as-of 2026-10-04
          --output-csv findings.csv
          --quality-csv data-quality.csv
          --output-json report.json
          --output-html report.html
          --snapshot-dir snapshots

      - name: Run scheduled report once
        run: >-
          saas-sentry watch
          --hr examples/hr.csv
          --usage examples/usage.csv
          --billing examples/billing.csv
          --contract-pricing examples/contract-pricing.csv
          --config config.example.toml
          --output-dir scheduled-reports
          --once
