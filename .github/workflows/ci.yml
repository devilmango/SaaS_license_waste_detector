name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run example analysis
        run: >-
          saas-sentry analyze
          --hr examples/hr.csv
          --usage examples/usage.csv
          --billing examples/billing.csv
          --contract-pricing examples/contract-pricing.csv
          --config config.example.toml
          --as-of 2026-10-04
          --output-csv findings.csv
          --quality-csv data-quality.csv
          --output-json report.json
          --output-html report.html
          --showback-csv showback.csv
          --renewals-csv renewals.csv
          --snapshot-dir snapshots

      - name: Import FOCUS billing example
        run: >-
          saas-sentry focus import
          --input examples/focus-billing.csv
          --output focus-spend.csv
          --config config.example.toml

      - name: Validate portfolio reconciliation, discovery, and forecast reports
        run: |
          saas-sentry reconcile \
            --hr examples/hr.csv --usage examples/usage.csv \
            --billing examples/billing.csv --contract-pricing examples/contract-pricing.csv \
            --focus focus-spend.csv --config config.example.toml \
            --output reconciliation.csv
          saas-sentry discover \
            --hr examples/hr.csv --usage examples/usage.csv \
            --billing examples/billing.csv --inventory examples/application-inventory.csv \
            --config config.example.toml --output portfolio-discovery.csv
          saas-sentry forecast \
            --hr examples/hr.csv --usage examples/usage.csv \
            --billing examples/billing.csv --contract-pricing examples/contract-pricing.csv \
            --config config.example.toml --price-increase-percent 8 \
            --seat-growth-percent 12 --seat-reduction-percent 10 \
            --output renewal-forecast.csv
          saas-sentry monitor \
            --current report.json --baseline report.json \
            --reconciliation reconciliation.csv --output anomalies.csv

      - name: Validate contract entitlement report and alert delivery preview
        run: |
          saas-sentry entitlements --billing examples/billing.csv \
            --contracts examples/contract-entitlements.csv --output entitlements.csv
          saas-sentry notify --alerts anomalies.csv --ledger alert-deliveries.csv \
            --webhook-url https://example.invalid/webhook
          saas-sentry import-health --hr examples/hr.csv --usage examples/usage.csv \
            --billing examples/billing.csv --output import-health.csv
          saas-sentry realization --actions actions.csv --findings findings.csv \
            --output savings-realization.csv
          saas-sentry verify-savings --actions actions.csv --findings findings.csv \
            --baseline-invoice examples/savings-before.csv \
            --current-invoice examples/savings-after.csv --output invoice-verification.csv
          saas-sentry contract-model --billing examples/billing.csv \
            --contracts examples/contract-entitlements.csv \
            --contract-pricing examples/contract-pricing.csv \
            --changes examples/contract-changes.csv \
            --period-start 2026-09-01 --period-end 2026-10-01 \
            --config config.example.toml --output contract-period.csv
          saas-sentry access-review create --findings findings.csv \
            --ledger access-review-events.csv --campaign-id ci-review \
            --due-on 2026-10-20 --created-by ci@example.com \
            --owner-map examples/application-owners.csv --default-owner finops@example.com
          saas-sentry access-review reminders --ledger access-review-events.csv \
            --as-of 2026-10-15 --within-days 7 --output access-review-reminders.csv
          saas-sentry access-review deliver-reminders --reminders access-review-reminders.csv \
            --ledger access-review-deliveries.csv --webhook-url https://example.invalid/reviews

      - name: Validate procurement imports, seat reassignment, and renewal approvals
        run: |
          saas-sentry procurement import --system coupa \
            --input examples/procurement-coupa.csv --config config.example.toml \
            --output procurement-invoices.csv
          saas-sentry reassign --hr examples/hr.csv --usage examples/usage.csv \
            --billing examples/billing.csv --findings examples/reassignment-findings.csv \
            --demand examples/license-demand.csv --config config.example.toml \
            --output reassignment-plan.csv
          saas-sentry reassignment stage --plan reassignment-plan.csv \
            --ledger reassignment-events.csv --staged-by finops@example.com --on 2026-10-04
          saas-sentry reassignment approve --ledger reassignment-events.csv \
            --finding-id demo-terminated-workspace --actor owner@example.com \
            --evidence-ref approvals/TRANSFER-1 --on 2026-10-04
          saas-sentry reassignment complete --ledger reassignment-events.csv \
            --finding-id demo-terminated-workspace --actor it@example.com \
            --evidence-ref tickets/TRANSFER-1 --on 2026-10-04
          saas-sentry reassignment list --ledger reassignment-events.csv
          saas-sentry contracts record --ledger renewal-contracts.csv \
            --contract-id ci-slack --vendor "Slack Inc" --owner finops@example.com \
            --application Slack --effective-date 2026-01-01 --renewal-date 2026-11-15 \
            --notice-days 30 --annual-commitment-inr 120000 --currency INR \
            --evidence-type order_form --evidence-ref evidence/ci-slack-order-form.pdf \
            --recorded-by procurement@example.com --on 2026-10-04
          saas-sentry renewals create --contracts renewal-contracts.csv \
            --ledger renewal-events.csv --as-of 2026-10-04 --horizon-days 90 \
            --created-by ci@example.com
          saas-sentry renewals decide --ledger renewal-events.csv \
            --contract-id ci-slack --version 1 --decision renegotiate \
            --decided-by finops@example.com --evidence-ref evidence/ci-renewal-review.pdf \
            --on 2026-10-04
          saas-sentry renewals approve --ledger renewal-events.csv \
            --contract-id ci-slack --version 1 --status approved \
            --approved-by finance@example.com --evidence-ref evidence/ci-budget-approval.pdf \
            --on 2026-10-04
          saas-sentry renewals list --ledger renewal-events.csv \
            --as-of 2026-10-04 --output renewal-audit.csv

      - name: Validate approved exception policy and dashboard report generation
        run: |
          saas-sentry exceptions request --ledger ci-exceptions.csv \
            --employee-id E003 --email john@company.com --application "Google Workspace" \
            --reason "Temporary transition coverage" --requested-by hr@example.com \
            --expires-on 2026-11-01 --evidence-ref tickets/HR-1 --on 2026-10-01
          exception_id=$(python -c 'import csv; print(next(csv.DictReader(open("ci-exceptions.csv"))) ["exception_id"])')
          saas-sentry exceptions approve --ledger ci-exceptions.csv \
            --exception-id "$exception_id" --approved-by security@example.com \
            --evidence-ref approvals/SEC-1 --on 2026-10-02
          saas-sentry analyze --hr examples/hr.csv --usage examples/usage.csv \
            --billing examples/billing.csv --config config.example.toml \
            --exceptions ci-exceptions.csv --as-of 2026-10-04 --output-csv policy-findings.csv

      - name: Validate provider and action CLI help
        run: |
          saas-sentry connect google-workspace --help
          saas-sentry connect slack --help
          saas-sentry connect github-copilot --help
          saas-sentry connect zoom --help
          saas-sentry actions --help
          saas-sentry actions execute --help
          saas-sentry actions resolve-execution --help
          saas-sentry actions verify-provider --help
          saas-sentry monitor --help
          saas-sentry notify --help
          saas-sentry entitlements --help
          saas-sentry import-health --help
          saas-sentry realization --help
          saas-sentry verify-savings --help
          saas-sentry sync --help
          saas-sentry access-review --help
          saas-sentry access-review deliver-reminders --help
          saas-sentry ledger migrate --help
          saas-sentry identity --help
          saas-sentry identity import-entra --help
          saas-sentry identity import-scim --help
          saas-sentry identity reconcile --help
          saas-sentry contracts --help
          saas-sentry contracts record --help
          saas-sentry contracts approve --help
          saas-sentry contracts reconcile --help
          saas-sentry reassign --help
          saas-sentry procurement --help
          saas-sentry procurement import --help
          saas-sentry renewals --help
          saas-sentry renewals create --help
          saas-sentry renewals decide --help
          saas-sentry renewals approve --help
          saas-sentry dashboard --help
          saas-sentry reassignment --help
          saas-sentry reassignment stage --help
          saas-sentry reassignment execute --help
          saas-sentry reassignment verify --help
          saas-sentry exceptions --help
          saas-sentry exceptions request --help
          saas-sentry exceptions approve --help
          saas-sentry exceptions revoke --help
          saas-sentry contract-model --help

      - name: Run scheduled report once
        run: >-
          saas-sentry watch
          --hr examples/hr.csv
          --usage examples/usage.csv
          --billing examples/billing.csv
          --contract-pricing examples/contract-pricing.csv
          --config config.example.toml
          --output-dir scheduled-reports
          --alerts-webhook-url https://example.invalid/webhook
          --once
